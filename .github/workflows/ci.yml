name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node }}, MongoDB ${{ matrix.mongo }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
        # Not 8.x for now: GitHub's newer runners have Linux 6.19+, where MongoDB 8.x refuses to
        # start (SERVER-121912, no fixed 8.x release yet). 7.0 uses the older allocator and runs.
        mongo: ['7.0']
    services:
      mongodb:
        image: mongo:${{ matrix.mongo }}
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build:registry
      - run: npm test
        env:
          MONGODB_TEST_URI: mongodb://127.0.0.1:27017

  pack:
    name: Pack and scaffold from the tarball
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - run: npm ci
      - run: npm pack --pack-destination /tmp
      - name: Create a project from the packed CLI
        working-directory: /tmp
        run: |
          npm install -g /tmp/calmapi-*.tgz
          calm create smoke-api --yes --no-install --no-git
          test -f smoke-api/calm/index.js
          test -f smoke-api/calm.lock
          calm add --list | grep -q jobs
